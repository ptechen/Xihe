[package]
name = "xihe-desktop"
description = "Warp-style terminal app with an agent mode, built on the Xihe ECS agent runtime."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
xihe = { workspace = true, features = ["openai", "hitl"] }
alacritty_terminal = "0.26"
async-trait.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
portable-pty = "0.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

[lints]
workspace = true