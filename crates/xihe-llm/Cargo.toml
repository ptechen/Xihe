[package]
name = "xihe-llm"
description = "Provider-agnostic chat-completion abstraction: messages, tool calls, streaming, mock and OpenAI-compatible providers."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
# Only needed for the opt-in `openai` feature; requires network to download.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
], optional = true }

[features]
default = []
# HTTP provider; pulls in reqwest.
openai = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
