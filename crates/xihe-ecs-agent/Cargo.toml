[package]
name = "xihe"
description = "A tokio-based entity-component-system framework for building AI agents."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
# Only needed for the opt-in `openai` feature; requires network to download.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = ["std-driver"]
# Re-export the batteries-included app/loop/plugins.
std-driver = []
# OpenAI-compatible HTTP provider.
openai = ["dep:reqwest"]
# Blocking human-in-the-loop approvals.
hitl = []
# JSONL memory persistence.
persist = []

[lints]
workspace = true